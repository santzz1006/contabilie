<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilis – Entrar</title>
<style>
:root{--bg:#FAF8F5;--surf:#FFFFFF;--surf2:#F5F1EC;--line:#EEE9E3;--tx:#1B1917;--tx2:#78716C;--or:#F97316;--or-h:#EA6A0C;--or-s:#FFEDD9;--dk:#1C1917;--dk-tx:#FFFFFF;--err:#DC2626;--ok:#16A34A;
  --glass:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.95);--neo-l:#FFFFFF;--neo-d:rgba(120,100,80,.18);--blob:rgba(249,115,22,.18);--ink:#2A2622;color-scheme:light}
:root[data-theme="dark"]{--bg:#262624;--surf:#30302E;--surf2:#3A3936;--line:#43413D;--tx:#F5F4EE;--tx2:#A8A29A;--or:#FF8A4C;--or-h:#FF9A64;--or-s:rgba(255,138,76,.14);--dk:#F5F4EE;--dk-tx:#262624;--err:#F87171;--ok:#4ADE80;
  --glass:rgba(48,48,46,.66);--glass-line:rgba(255,255,255,.08);--neo-l:rgba(255,255,255,.04);--neo-d:rgba(0,0,0,.38);--blob:rgba(255,138,76,.14);--ink:#5A564F;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--tx);
  font:14px/1.5 "Inter","Geist",system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s;overflow-x:clip}
body::before{content:"";position:fixed;width:560px;height:560px;left:-160px;bottom:-200px;border-radius:50%;background:var(--blob);filter:blur(100px);pointer-events:none}
body::after{content:"";position:fixed;width:420px;height:420px;right:-120px;top:-140px;border-radius:50%;background:var(--blob);filter:blur(100px);pointer-events:none}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:8px}
.theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:5;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--tx2);
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line)}
.theme svg,.eyeb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico-sun{display:none}[data-theme="dark"] .ico-sun{display:block}[data-theme="dark"] .ico-moon{display:none}
.wrap{position:relative;z-index:1;width:min(980px,100%)}
.card{display:grid;grid-template-columns:1.05fr 1fr;min-height:0;border-radius:24px;overflow:hidden;background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid var(--glass-line);box-shadow:0 24px 60px rgba(60,40,20,.10),0 1px 2px rgba(60,40,20,.05)}
.stage{background:var(--surf2);display:flex;align-items:flex-end;justify-content:center;padding:32px 24px 0;position:relative}
.stage .hello{position:absolute;top:28px;left:32px;right:32px;font-size:13px;color:var(--tx2)}
#art{width:100%;max-width:430px;height:auto;display:block;overflow:visible}
.form{background:var(--surf);padding:36px 44px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:600;letter-spacing:-.01em;margin-bottom:18px}
.logo{width:30px;height:30px;border-radius:10px;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
h1{font-size:28px;letter-spacing:-.025em;font-weight:600;text-align:center;line-height:1.15}
.sub{color:var(--tx2);font-size:13px}.lead{text-align:center;margin:4px 0 20px}
label.f{display:block;font-size:12px;color:var(--tx2);font-weight:500;margin-bottom:4px}
.in{position:relative;margin-bottom:14px}
.in input{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
.in input::placeholder{color:var(--tx2);opacity:.7}
.in input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-s)}
.in input[aria-invalid="true"]{border-color:var(--err)}
.in.pwd input{padding-right:48px}
.eyeb{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);background:var(--surf);
  box-shadow:2px 2px 6px var(--neo-d),-2px -2px 6px var(--neo-l)}
.eyeb:active{box-shadow:inset 2px 2px 5px var(--neo-d),inset -2px -2px 5px var(--neo-l)}
.eye-off{display:none}.eyeb.on .eye-on{display:none}.eyeb.on .eye-off{display:block}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:2px 0 16px;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx2);cursor:pointer}
.chk input{accent-color:var(--or);width:16px;height:16px}
.lnk{color:var(--tx2);font-size:13px}.lnk[disabled]{opacity:.55;cursor:not-allowed}
.msg{min-height:20px;color:var(--err);font-size:13px;margin-bottom:8px}
.btn{width:100%;height:46px;border-radius:12px;background:var(--dk);color:var(--dk-tx);font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;flex:none;transition:transform .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}.btn:disabled{cursor:default;opacity:.85}
.btn.ghost{background:var(--surf);color:var(--tx);border:1px solid var(--line)}.btn.ghost:disabled{opacity:.55;cursor:not-allowed}
.or{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--tx2);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.spin{width:16px;height:16px;display:none}.loading .spin{display:block}
.foot{text-align:center;margin-top:16px;font-size:13px;color:var(--tx2)}
.cap{text-align:center;margin-top:16px;color:var(--tx2)}
.demo{text-align:center;font-size:11px;color:var(--tx2);margin-top:6px}
@media (max-width:820px){.card{grid-template-columns:1fr;min-height:0}.stage{padding:44px 24px 0;order:-1}#art{max-width:230px}.form{padding:30px 22px}.stage .hello{left:22px;right:22px;top:20px}}
@media (max-height:720px){.or,.btn.ghost,.cap{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Alternar tema">
  <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
  <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
</button>

<div class="wrap">
  <main class="card" id="card">
    <section class="stage" aria-hidden="true">
      <p class="hello">Sua carteira de clientes, em dia.</p>
      <svg id="art" viewBox="0 0 400 300"></svg>
    </section>

    <section class="form">
      <div class="brand fx"><div class="logo">C</div>Contabilis</div>
      <h1 class="fx">Bem-vindo de volta</h1>
      <p class="sub lead fx">Entre para acompanhar a competência do seu escritório.</p>
      <form id="form" novalidate>
        <div class="fx"><label class="f" for="email">E-mail</label>
          <div class="in"><input id="email" type="email" autocomplete="email" placeholder="nome@escritorio.com.br"></div></div>
        <div class="fx"><label class="f" for="pw">Senha</label>
          <div class="in pwd"><input id="pw" type="password" autocomplete="current-password" placeholder="Mínimo de 6 caracteres">
            <button type="button" class="eyeb" id="eye" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="eye-on" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6C3.8 8.3 2 12 2 12s3.5 7 10 7a10 10 0 004.2-.9M9.9 9.9a3 3 0 004.2 4.2"/></svg>
            </button></div></div>
        <div class="row fx"><label class="chk"><input type="checkbox" id="rem" checked>Manter conectado por 30 dias</label>
          <button type="button" class="lnk" disabled title="Indisponível na demonstração">Esqueci a senha</button></div>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
        <button class="btn fx" id="go" type="submit"><svg class="spin" id="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 019 9"/></svg><span id="gl">Entrar</span></button>
      </form>
      <div class="or fx">ou</div>
      <button class="btn ghost fx" disabled title="Indisponível na demonstração">Entrar com Google</button>
      <p class="foot fx">Ainda não tem conta? <button class="lnk" disabled style="text-decoration:underline" title="Indisponível na demonstração">Falar com a equipe</button></p>
    </section>
  </main>
  <p class="sub cap" id="cap">Digite a senha e observe como eles reagem.</p>
  <p class="demo">Demonstração: aceita qualquer e-mail válido e senha com 6 ou mais caracteres. Nenhum dado é enviado.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,root=document.documentElement;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t;else if(matchMedia('(prefers-color-scheme:dark)').matches)root.dataset.theme='dark'}catch(e){}
$('#theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}};

/* personagens contábeis: livro-razão, calculadora, moeda e selo de percentual */
const eyeG=(x,y,r,p)=>`<g transform="translate(${x} ${y})"><g class="eye"><g class="bk"><g class="lid"><circle class="sc" r="${r}" fill="#fff"/><g class="pup"><circle r="${p}" fill="#1C1917"/><circle cx="${p*.35}" cy="${-p*.4}" r="${p*.3}" fill="#fff"/></g></g></g><ellipse class="bl" cy="${r+6}" rx="6" ry="3.5" fill="#F43F5E" opacity="0"/></g></g>`;
const browG=(e,r,c)=>`<g transform="translate(${e[0]} ${e[1]-r-8})"><path class="brow" d="M-7 0H7" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></g>`;
const faceG=(a,b,r,p,m,c)=>`<g class="face">${eyeG(a[0],a[1],r,p)}${eyeG(b[0],b[1],r,p)}${browG(a,r,c)}${browG(b,r,c)}<path class="mouth" transform="translate(${m[0]} ${m[1]})" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></g>`;
$('#art').innerHTML=
`<g class="ch"><rect x="120" y="40" width="100" height="200" rx="14" fill="var(--ink)"/><path d="M120 54a14 14 0 0114-14v200a14 14 0 01-14-14z" fill="rgba(0,0,0,.22)"/><path d="M202 40h12v28l-6-5-6 5z" fill="var(--or)"/><path d="M142 152h66M142 168h66M142 184h66M178 146v44" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="round"/>${faceG([150,90],[190,90],10.5,5.2,[170,126],'#fff')}</g>
<g class="ch"><rect x="215" y="130" width="80" height="140" rx="14" fill="#FDBA74"/><rect x="225" y="138" width="60" height="18" rx="5" fill="#1C1917" opacity=".88"/><text x="279" y="151" text-anchor="end" font-size="10" font-weight="600" fill="#FDBA74">0,00</text>${faceG([243,184],[271,184],9.5,4.8,[257,208],'#1C1917')}<g fill="rgba(28,25,23,.25)"><rect x="250" y="226" width="14" height="10" rx="3"/><rect x="268" y="226" width="14" height="10" rx="3"/><rect x="250" y="242" width="14" height="10" rx="3"/></g><rect x="268" y="242" width="14" height="10" rx="3" fill="var(--or)"/></g>
<g class="ch"><path d="M30 300a110 110 0 01220 0z" fill="var(--or)"/><path d="M48 300a92 92 0 01184 0" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/><text x="140" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="rgba(255,255,255,.85)">R$</text>${faceG([112,240],[150,240],10.5,5.2,[131,270],'#1C1917')}</g>
<g class="ch"><path d="M290 300V218a35 35 0 0170 0v82z" fill="#FBBF24"/><text x="325" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="rgba(28,25,23,.55)">%</text>${faceG([310,236],[338,236],9,4.4,[324,262],'#1C1917')}</g>`;

/* personagens */
const svg=$('#art'),faces=$$('.face'),lids=$$('.lid'),pups=$$('.pup'),scs=$$('.eye .sc'),brows=$$('.brow'),bls=$$('.bl'),bks=$$('.bk');
const mouths=$$('.mouth').map((el,i)=>({el,v:[.15,0,.6,.5][i]})),BASE=mouths.map(m=>m.v);
const paint=m=>m.el.setAttribute('d',`M-9 0Q0 ${m.v*13} 9 0`);mouths.forEach(paint);
function setMouth(a){mouths.forEach((m,i)=>RM?(m.v=a[i],paint(m)):gsap.to(m,{v:a[i],duration:.3,ease:'power2.out',overwrite:true,onUpdate:()=>paint(m)}))}
let mode='mouse',ptr={x:innerWidth*.7,y:innerHeight*.4},raf=0;
function target(){
  const r=svg.getBoundingClientRect(),em=$('#email'),pw=$('#pw');
  if(mode==='email'){const e=em.getBoundingClientRect();return{x:e.left+14+Math.min(em.value.length*7.5,e.width-28),y:e.top+e.height/2}}
  if(mode==='peek'){const e=pw.getBoundingClientRect();return{x:e.left+e.width/2,y:e.top+e.height/2}}
  if(mode==='away')return{x:r.left-260,y:r.top-140};
  if(mode==='error')return{x:r.left+r.width/2,y:r.bottom+300};
  return ptr}
function look(){
  const t=target(),r=svg.getBoundingClientRect(),cl=(v)=>Math.max(-1,Math.min(1,v));
  gsap.to(faces,{x:cl((t.x-(r.left+r.width/2))/320)*5,y:cl((t.y-(r.top+r.height/2))/260)*3,duration:RM?0:.35,ease:'power2.out',overwrite:'auto'});
  scs.forEach((s,i)=>{const b=s.getBoundingClientRect(),dx=t.x-(b.left+b.width/2),dy=t.y-(b.top+b.height/2),d=Math.hypot(dx,dy)||1,m=Math.min(4.8,d/40*4.8);
    gsap.to(pups[i],{x:dx/d*m,y:dy/d*m,duration:RM?0:.25,ease:'power2.out',overwrite:'auto'})})}
function setMode(m){
  mode=m;look();gsap.killTweensOf(bks);gsap.set(bks,{scaleY:1});
  const P={away:[-8,8,-1,.45],peek:[0,0,-4,.2],error:[-16,16,2,0],happy:[0,0,-2,.4]}[m]||[0,0,0,0],D=RM?0:.25;
  gsap.to(lids,{scaleY:m==='away'?.92:m==='peek'?1.1:1,duration:D,ease:'power2.out',overwrite:'auto'});
  gsap.to(brows,{rotation:i=>i%2?P[1]:P[0],y:P[2],duration:D,ease:'power2.out',overwrite:'auto'});
  gsap.to(bls,{opacity:P[3],duration:D,overwrite:'auto'});
  setMouth(m==='away'?[0,-.1,-.15,.1]:m==='peek'?[.9,.8,.9,1]:m==='error'?[-1,-1,-1,-.9]:m==='happy'?[1,1,1,1]:BASE)}
addEventListener('pointermove',e=>{ptr={x:e.clientX,y:e.clientY};if(mode==='mouse'&&!raf)raf=requestAnimationFrame(()=>{raf=0;look()})});
addEventListener('resize',look);
if(!RM)(function loop(){setTimeout(()=>{if(mode==='mouse'||mode==='email')gsap.fromTo(bks,{scaleY:1},{scaleY:.05,duration:.07,yoyo:true,repeat:1,ease:'none',onComplete:()=>gsap.set(bks,{scaleY:1})});loop()},2800+Math.random()*2800)})();

/* formulário */
const em=$('#email'),pw=$('#pw'),eye=$('#eye'),msg=$('#msg'),go=$('#go');
const pwMode=()=>pw.type==='password'?'away':'peek';
function recover(){msg.textContent='';em.removeAttribute('aria-invalid');pw.removeAttribute('aria-invalid');
  if(mode==='error')setMode(document.activeElement===pw?pwMode():document.activeElement===em?'email':'mouse')}
em.onfocus=()=>setMode('email');em.oninput=()=>{recover();look()};
pw.onfocus=()=>setMode(pwMode());pw.oninput=recover;
function blurCheck(){setTimeout(()=>{if(![em,pw,eye].includes(document.activeElement)&&mode!=='error'&&mode!=='happy')setMode('mouse')},0)}
em.onblur=pw.onblur=blurCheck;
eye.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.classList.toggle('on',show);eye.setAttribute('aria-pressed',show);
  eye.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');pw.focus();setMode(pwMode())};
function fail(text,el){msg.textContent=text;el.setAttribute('aria-invalid','true');el.focus();setMode('error');
  if(!RM)gsap.to('#card',{keyframes:{x:[-8,8,-5,5,0],easeEach:'power1.inOut'},duration:.4})}
$('#form').onsubmit=e=>{
  e.preventDefault();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim()))return fail('Digite um e-mail válido, por exemplo nome@escritorio.com.br.',em);
  if(pw.value.length<6)return fail('A senha precisa ter pelo menos 6 caracteres.',pw);
  go.disabled=true;go.classList.add('loading');$('#gl').textContent='Entrando';setMode('mouse');
  const sp=gsap.to('#spin',{rotation:360,transformOrigin:'50% 50%',duration:.7,repeat:-1,ease:'none'});
  setTimeout(()=>{sp.kill();go.classList.remove('loading');$('#gl').textContent='Acesso confirmado';setMode('happy');
    if(!RM)gsap.to('.ch',{y:-14,duration:.25,yoyo:true,repeat:1,stagger:.08,ease:'power2.out'});
    msg.style.color='var(--ok)';msg.textContent='Em produção, o Contabilis abriria o painel agora.';
    setTimeout(()=>{go.disabled=false;$('#gl').textContent='Entrar';msg.textContent='';msg.style.color='';setMode('mouse')},2600)},1000)};

/* entrada */
look();
if(!RM)gsap.timeline({defaults:{ease:'power2.out'}})
  .from('#card',{opacity:0,y:14,duration:.4})
  .from('.ch',{y:50,opacity:0,duration:.5,stagger:.07,ease:'back.out(1.4)'},.15)
  .from('.fx',{opacity:0,y:8,duration:.3,stagger:.05},.2)
  .from('#cap',{opacity:0,duration:.3},.5);
setTimeout(()=>gsap.set('.fx,.ch,#card,#cap',{clearProps:'opacity,transform'}),2600);
</script>
</body>
</html>
