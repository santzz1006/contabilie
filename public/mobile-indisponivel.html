*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
 padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{width:min(440px,100%);background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.stage{position:relative;background:var(--stage);padding-top:58px}
.stage>svg{display:block;width:100%;height:auto}
.chip svg{width:14px;height:14px;flex:none}
.chip{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:12px;font-weight:600}
.fl{fill:var(--floor)}
.body{padding:26px 24px 28px;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand img{background:#f5f4ee;padding:4px;border-radius:10px;object-fit:contain;flex:none}
h1{margin:18px 0 10px;font-size:clamp(30px,9vw,38px);line-height:1.05;letter-spacing:-.04em;font-weight:800}
.lead{margin:0 auto 22px;max-width:34ch;color:var(--muted);font-size:16px;line-height:1.45}
button{width:100%;height:56px;border:0;border-radius:18px;background:var(--btn);color:var(--btnink);font:700 17px/1 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.98)}
.foot{margin:16px 0 0;font-size:13px;color:var(--muted)}
</style>

<div class="body">
<div class="brand"><img src="/contabilis-simbolo-escuro.svg" width="40" height="40" alt="">Contabilis</div>
<h1>Versão mobile indisponível</h1>
<p class="lead">O Contabilis foi feito para o computador. Abra no desktop para acompanhar a carteira de clientes do seu escritório.</p>
<button id="copy" type="button">Copiar link para abrir no PC</button>
<p class="foot">Sem tela grande por perto? Salve o link e abra mais tarde.</p>

<script>
(function(){
var $=function(i){return document.getElementById(i)},PI=Math.PI,LOOP=10;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function f(n){return Math.round(n*100)/100}
function sm(u){u=u<0?0:u>1?1:u;return u*u*(3-2*u)}
function tr(a,t){if(t<=a[0][0])return a[0][1];for(var i=0;i<a.length-1;i++){if(t<=a[i+1][0])return a[i][1]+(a[i+1][1]-a[i][1])*sm((t-a[i][0])/(a[i+1][0]-a[i][0]))}return a[a.length-1][1]}
function set(id,k,v){$(id).setAttribute(k,v)}
var K={
an:[[0,0],[2.2,0],[3,1],[5.2,1],[5.8,0],[10,0]],
rl:[[0,0],[5.2,0],[5.8,1],[7.6,1],[8.2,0],[10,0]],
shake:[[0,0],[2.9,0],[3,1],[3.7,1],[3.8,0],[10,0]],
tw:[[0,1],[3,1],[3.1,0],[3.7,0],[3.8,1],[5,1],[5.1,0],[8.9,0],[9,1],[10,1]],
fy:[[0,162],[3.1,162],[3.3,126],[3.45,167],[3.7,162],[5,162],[5.4,149],[8.7,149],[9.1,162],[10,162]],
hx:[[0,196],[3.9,196],[4.7,234],[4.95,234],[5.3,224],[5.5,222],[7.4,222],[8,234],[8.15,234],[8.9,196],[10,196]],
hy:[[0,192],[3.9,192],[4.7,132],[4.95,132],[5.3,106],[5.5,108],[7.4,108],[8,132],[8.15,132],[8.9,192],[10,192]],
py:[[0,0],[3.8,0],[4.2,2.5],[5,2.5],[5.4,-1],[7.4,-1],[8,2],[8.5,0],[10,0]]};
var L=35,SN=[170,148],SF=[172,148],SOCK=[237,123],CAB=[284,142],CL=118;
/* braço de 2 ossos iguais: o cotovelo sempre fica abaixo da linha ombro→mão */
function arm(S,H,o,i,h){
 var dx=H[0]-S[0],dy=H[1]-S[1],d=Math.max(10,Math.min(Math.sqrt(dx*dx+dy*dy),2*L-.5)),a=Math.atan2(dy,dx),al=Math.acos(d/(2*L)),
 e=[S[0]+L*Math.cos(a+al),S[1]+L*Math.sin(a+al)],p=[S[0]+d*Math.cos(a),S[1]+d*Math.sin(a)],
 s='M'+f(S[0])+' '+f(S[1])+'L'+f(e[0])+' '+f(e[1])+'L'+f(p[0])+' '+f(p[1]);
 set(o,'d',s);set(i,'d',s);set(h,'cx',f(p[0]));set(h,'cy',f(p[1]));return p}
function screen(t){
 var o=1,sy=1,m=0,ln=0,lw=0,dt=0,fh=0,led=1;
 if(t>=5.1&&t<5.5){o=.4;m=1}
 else if(t>=5.5&&t<5.8){sy=1-.97*sm((t-5.5)/.3)}
 else if(t>=5.8&&t<6.05){o=0;ln=1;lw=1-sm((t-5.8)/.25)}
 else if(t>=6.05&&t<6.25){o=0;dt=1-sm((t-6.05)/.2)}
 else if(t>=6.25&&t<8.15){o=0}
 else if(t>=8.15&&t<8.35){o=0;ln=1;lw=sm((t-8.15)/.2);fh=.5*(1-(t-8.15)/.2)}
 else if(t>=8.35&&t<8.7){sy=.03+.97*sm((t-8.35)/.35)}
 if(t>=5.1&&t<8.3)led=0;
 set('ui','transform','translate(311 113) scale(1 '+f(sy)+') translate(-311 -113)');set('ui','opacity',o);
 set('msg','opacity',m);set('ln','opacity',ln);set('ln','x',f(311-41*lw));set('ln','width',f(82*lw));
 set('dt','opacity',f(dt));set('fh','opacity',f(fh));set('led','fill',led?'#fbbf24':'#46433d')}
function render(t){
 var lt=t%LOOP,an=tr(K.an,lt),rl=tr(K.rl,lt),i;
 /* cabeça */
 var sh=tr(K.shake,lt)*1.3*Math.sin(lt*45),tilt=3*an-2*rl;
 set('hd','transform','translate('+f(sh)+' '+f(Math.sin(lt*2)*.6)+') rotate('+f(tilt)+' 112 123)');
 var bl=(lt%3.4)<.12?.1:1;set('eyes','transform','translate(0 102) scale(1 '+bl+') translate(0 -102)');
 var py=tr(K.py,lt);set('p1','cy',f(102+py));set('p2','cy',f(102+py));
 var ang=20*an-6*rl;
 set('b1','transform','translate(116 89) rotate('+f(ang)+')');set('b2','transform','translate(136 89) rotate('+f(-ang)+')');
 set('mo','d','M118 114Q126 '+f(114-6*an+7*rl)+' 134 114');
 set('flush','opacity',f(.45*an));
 var k=Math.max(0,Math.min(1,(an-.4)*3));
 for(i=0;i<3;i++){var ph=(lt*1.3+i/3)%1;set('s'+i,'cx',f(106+i*16));set('s'+i,'cy',f(66-ph*24));set('s'+i,'r',f(3+ph*4));set('s'+i,'opacity',f((1-ph)*.9*k))}
 /* braço de trás: digita no teclado (e dá o soco na mesa) */
 var tw=tr(K.tw,lt);
 arm(SF,[230+2*Math.sin(lt*11)*tw,tr(K.fy,lt)-2*Math.abs(Math.sin(lt*10))*tw],'fo','fi','fh2');
 /* braço da frente: vai até a tomada e puxa o plugue */
 var H=[tr(K.hx,lt),tr(K.hy,lt)],p=arm(SN,H,'no','ni','nh');
 var held=lt>=4.95&&lt<8.15,P=held?[p[0]+3,p[1]-9]:SOCK,pr=held?-8*Math.sin(lt*7)*(lt>5.5?.4:1):0;
 set('plug','transform','translate('+f(P[0])+' '+f(P[1])+') rotate('+f(pr)+')');
 /* cabo preso no monitor e no plugue, nunca atravessa a mesa */
 var ex=P[0]+9,ey=P[1],dx=CAB[0]-ex,dy=CAB[1]-ey,d=Math.sqrt(dx*dx+dy*dy),
 cy=(CAB[1]+ey)/2+Math.max(8,(CL-d)*.8);cy=Math.min(cy,2*158-(CAB[1]+ey)/2);
 set('cab','d','M'+CAB[0]+' '+CAB[1]+'Q'+f((CAB[0]+ex)/2)+' '+f(cy)+' '+f(ex)+' '+f(ey));
 /* faíscas, soco, caneca, monitor, relógio, tela */
 var u1=(lt-4.95)/.4,u2=(lt-8.15)/.35;
 if(u1>=0&&u1<1){set('sp','transform','translate(237 123) scale('+f(.6+u1)+')');set('sp','opacity',f(1-u1))}
 else if(u2>=0&&u2<1){set('sp','transform','translate(237 123) scale('+f(.5+.6*u2)+')');set('sp','opacity',f(.9*(1-u2)))}
 else set('sp','opacity',0);
 var hu=(lt-3.45)/.45,iu=(lt-3.45)/.25;
 set('mug','transform','translate(0 '+f(hu>=0&&hu<1?-8*Math.sin(PI*hu):0)+')');
 set('mon','transform','rotate('+f(hu>=0&&hu<1?1.2*Math.sin(hu*30)*(1-hu):0)+' 311 170)');
 if(iu>=0&&iu<1){set('im','transform','translate(239 166)');set('im','opacity',f(1-iu))}else set('im','opacity',0);
 set('cm','transform','translate(327 46) rotate('+f(lt*30)+')');set('ch','transform','translate(327 46) rotate('+f(lt*2.5)+')');
 set('ring','transform','translate(319 116) rotate('+f(lt*300%360)+')');
 screen(lt)}
if(reduce)render(2);
else{var last=0,T=0;(function frame(ms){requestAnimationFrame(frame);var dt=Math.min((ms-last)/1000||0,.05);last=ms;T+=dt;render(T)})(0)}
var btn=$('copy'),label=btn.textContent;
function done(){btn.textContent='Link copiado!';setTimeout(function(){btn.textContent=label},2000)}
function fb(){var ta=document.createElement('textarea');ta.value=location.href;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done()}
btn.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(location.href).then(done,fb)}else fb()});
})();
</script>
