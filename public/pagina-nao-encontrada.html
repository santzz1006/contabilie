<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilis · Página não encontrada</title>
<style>
:root{--bg:#262523;--stage:#3a3936;--card:#30302e;--floor:#2f2e2c;--ink:#f5f4ee;--muted:#a9a69e;--line:#464441;--btn:#f5f4ee;--btn-ink:#1c1917;--chip:#3d3b38;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3efe6;--stage:#ece7dc;--card:#fffdf9;--floor:#e0dacd;--ink:#1c1917;--muted:#6f6a5f;--line:#ddd6c8;--btn:#1c1917;--btn-ink:#fffdf9;--chip:#f0ebe0;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3efe6;--stage:#ece7dc;--card:#fffdf9;--floor:#e0dacd;--ink:#1c1917;--muted:#6f6a5f;--line:#ddd6c8;--btn:#1c1917;--btn-ink:#fffdf9;--chip:#f0ebe0;color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font-family:"Plus Jakarta Sans",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
.card{width:min(440px,100%);background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:in .7s cubic-bezier(.2,.8,.2,1) both}
.stage{background:var(--stage)}
.stage svg{display:block;width:100%;height:auto}
.body{padding:6px 28px 30px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand img{background:#f5f4ee;padding:4px;border-radius:10px;object-fit:contain;flex:none}
.brand i{width:34px;height:34px;border-radius:10px;background:#ff8a4c;display:grid;place-items:center}
.pill{display:inline-block;margin:18px 0 0 12px;padding:5px 12px;border-radius:99px;background:rgba(255,138,76,.16);color:#ff8a4c;font-size:13px;font-weight:800;letter-spacing:.02em;vertical-align:middle}
h1{margin:14px 0 8px;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
.sub{margin:0 0 16px;font-size:15px;line-height:1.5;color:var(--muted)}
.path{margin:0 0 22px}
.path code{display:inline-block;max-width:100%;padding:7px 12px;border-radius:10px;background:var(--chip);color:var(--muted);font:600 13px ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:10px;border:0;border-radius:99px;background:var(--btn);color:var(--btn-ink);font:inherit;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.back{margin:20px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.back a{color:var(--muted);text-underline-offset:3px}.back a:hover{color:var(--ink)}
.q{font:800 20px system-ui,sans-serif}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (min-width:900px){
.card{width:min(1080px,94vw);display:grid;grid-template-columns:1.35fr 1fr;border-radius:36px}
.stage{display:flex;background:linear-gradient(90deg,var(--stage) 78%,var(--card))}
.stage svg{height:100%;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.body{padding:52px 56px 44px 16px;align-self:center}
h1{font-size:38px;margin:16px 0 10px}
.sub{font-size:16px}
}
</style>
</head>
<body>
<main class="card">
  <div class="stage">
    <svg viewBox="0 0 360 264" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--floor)"/><stop offset=".25" style="stop-color:var(--floor)"/><stop offset="1" style="stop-color:var(--card)"/></linearGradient></defs>
      <rect x="0" y="240" width="360" height="25" fill="url(#fg)"/>
      <!-- parede e plantinha -->
      <rect x="28" y="54" width="56" height="48" rx="6" fill="#46433d" stroke="#5a564f" stroke-width="4"/>
      <rect x="40" y="78" width="8" height="14" rx="2" fill="#ff8a4c"/><rect x="53" y="68" width="8" height="24" rx="2" fill="#fdba74"/><rect x="66" y="60" width="8" height="32" rx="2" fill="#fbbf24"/>
      <ellipse cx="52" cy="206" rx="6" ry="18" fill="#5f9b52"/><ellipse cx="42" cy="213" rx="5" ry="13" fill="#74b063" transform="rotate(-25 42 213)"/><ellipse cx="62" cy="213" rx="5" ry="13" fill="#74b063" transform="rotate(25 62 213)"/>
      <path d="M42 226H62L60 240H44Z" fill="#ff8a4c"/><rect x="40" y="221" width="24" height="7" rx="3" fill="#ff9d66"/>
      <!-- sombras -->
      <ellipse cx="132" cy="241" rx="34" ry="4" fill="#000" opacity=".2"/><ellipse cx="234" cy="241" rx="62" ry="4" fill="#000" opacity=".2"/>
      <!-- arquivo: pastas, gaveta aberta e gavetas fechadas -->
      <g id="fl"></g>
      <rect x="178" y="130" width="112" height="110" rx="8" fill="#46433d"/>
      <rect x="184" y="134" width="100" height="32" rx="7" fill="#6a665e"/><rect x="220" y="147.5" width="28" height="5" rx="2.5" fill="#ff8a4c"/>
      <rect x="184" y="170" width="100" height="32" rx="7" fill="#5a564f"/><rect x="220" y="183.5" width="28" height="5" rx="2.5" fill="#ff8a4c"/>
      <rect x="184" y="206" width="100" height="30" rx="7" fill="#5a564f"/><rect x="220" y="218.5" width="28" height="5" rx="2.5" fill="#ff8a4c"/>
      <!-- contador -->
      <path id="fo" fill="none" stroke="#cfcabb" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path id="fi" fill="none" stroke="#e6e3d8" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle id="fh" r="6.5" fill="#e8ab85"/>
      <rect x="118" y="82" width="16" height="18" rx="4" fill="#e8ab85"/>
      <rect x="126" y="172" width="17" height="60" rx="8.5" fill="#46433d"/>
      <path d="M124 240V234Q124 228 131 228H145Q154 230 154 236V240Z" fill="#2b2724"/><rect x="124" y="237" width="30" height="3" fill="#a9a69e"/>
      <rect x="112" y="172" width="17" height="60" rx="8.5" fill="#5a564f"/>
      <path d="M110 240V234Q110 228 117 228H131Q140 230 140 236V240Z" fill="#1c1917"/><rect x="110" y="237" width="30" height="3" fill="#d3cdbf"/>
      <rect x="106" y="92" width="44" height="80" rx="15" fill="#f5f4ee" stroke="#d3cdbf" stroke-width="1.5"/>
      <rect x="106" y="160" width="48" height="26" rx="13" fill="#5a564f"/>
      <g id="hd"><g transform="translate(12 -37)">
        <rect x="92" y="77" width="56" height="46" rx="20" fill="#f4c19c"/><circle cx="93" cy="104" r="5" fill="#e8ab85"/>
        <path d="M92 100C88 72 108 68 122 68C140 68 150 78 148 96L145 90C138 82 110 80 99 94Z" fill="#1c1917"/>
        <g id="eyes"><circle cx="116" cy="102" r="6" fill="#fff"/><circle cx="136" cy="102" r="6" fill="#fff"/><circle id="p1" cx="118.5" cy="102" r="2.6" fill="#1c1917"/><circle id="p2" cx="138.5" cy="102" r="2.6" fill="#1c1917"/></g>
        <circle cx="116" cy="102" r="7.5" fill="none" stroke="#1c1917" stroke-width="1.8"/><circle cx="136" cy="102" r="7.5" fill="none" stroke="#1c1917" stroke-width="1.8"/><path d="M123.5 101Q126 99.5 128.5 101" fill="none" stroke="#1c1917" stroke-width="1.6"/>
        <g id="b1"><path d="M-6 0H6" stroke="#1c1917" stroke-width="2.6" stroke-linecap="round"/></g><g id="b2"><path d="M-6 0H6" stroke="#1c1917" stroke-width="2.6" stroke-linecap="round"/></g>
        <path id="mo" fill="none" stroke="#1c1917" stroke-width="2.2" stroke-linecap="round"/>
      </g></g>
      <path id="no" fill="none" stroke="#cfcabb" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path id="ni" fill="none" stroke="#f5f4ee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle id="nh" r="6.5" fill="#f4c19c"/>
      <!-- interrogações e folha caindo -->
      <text class="q" id="q0" x="100" y="26" fill="#fbbf24">?</text><text class="q" id="q1" x="134" y="20" fill="#ff8a4c">?</text><text class="q" id="q2" x="172" y="50" fill="#fdba74">?</text>
      <g id="pp" opacity="0"><rect x="-9" y="-12" width="18" height="24" rx="2.5" fill="#f5f4ee" stroke="#d3cdbf" stroke-width="1.2"/><path d="M-5 -6H5M-5 -2H5M-5 2H1" stroke="#d3cdbf" stroke-width="1.6" stroke-linecap="round"/><circle cx="3.5" cy="7.5" r="2.4" fill="#ff8a4c"/></g>
    </svg>
  </div>

  <div class="body">
    <div class="brand"><img src="/contabilis-simbolo-escuro.svg" width="40" height="40" alt="">Contabilis</div><span class="pill">Erro 404</span>
    <h1>Página não encontrada</h1>
    <p class="sub">Procuramos em todo o arquivo e essa pasta não está aqui. O endereço pode ter sido digitado errado ou a página foi movida.</p>
    <p class="path"><code id="path"></code></p>
    <a class="btn" href="/">Voltar para o início</a>
    <button class="btn ghost" id="prev" type="button">Voltar à página anterior</button>
    <p class="back">Precisa de ajuda? <a href="/contato">Falar com a equipe</a></p>
  </div>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)},PI=Math.PI,T=9;
  function f(n){return Math.round(n*100)/100}
  function sm(u){u=u<0?0:u>1?1:u;return u*u*(3-2*u)}
  function tr(a,t){if(t<=a[0][0])return a[0][1];for(var i=0;i<a.length-1;i++){if(t<=a[i+1][0])return a[i][1]+(a[i+1][1]-a[i][1])*sm((t-a[i][0])/(a[i+1][0]-a[i][0]))}return a[a.length-1][1]}
  function set(id,k,v){$(id).setAttribute(k,v)}

  /* endereço que o usuário tentou abrir */
  $('path').textContent=location.pathname+location.search;
  $('prev').addEventListener('click',function(){history.length>1?history.back():location.assign('/')});

  /* pastas do arquivo (a de índice 6 está faltando) */
  var COL=['#ff8a4c','#fdba74','#fbbf24','#f5f4ee','#ff8a4c','#fdba74','','#fbbf24','#ff8a4c','#fdba74'],TOP=[94,100,92,98,94,102,0,96,92,100],fl=$('fl'),FO=[],h='';
  for(var k=0;k<10;k++){
    var x=190+k*9.2;
    if(k===6){h+='<rect x="'+x+'" y="100" width="7.5" height="30" rx="2" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="3 3"/>';continue}
    h+='<g id="f'+k+'"><rect x="'+x+'" y="'+TOP[k]+'" width="7.5" height="'+(134-TOP[k])+'" rx="2" fill="'+COL[k]+'"/><rect x="'+(x+1.2)+'" y="'+(TOP[k]+4)+'" width="5.1" height="3" rx="1.5" fill="#000" opacity=".16"/></g>';
  }
  fl.innerHTML=h;
  for(k=0;k<10;k++)FO.push($('f'+k));

  /* braço de dois ossos; o cotovelo sempre dobra para baixo */
  var L=36;
  function arm(S,H,o,i,hd){
    var dx=H[0]-S[0],dy=H[1]-S[1],d=Math.max(10,Math.min(Math.sqrt(dx*dx+dy*dy),2*L-.5)),a=Math.atan2(dy,dx),al=Math.acos(d/(2*L)),s=dx>=0?1:-1,
    e=[S[0]+L*Math.cos(a+s*al),S[1]+L*Math.sin(a+s*al)],p=[S[0]+d*Math.cos(a),S[1]+d*Math.sin(a)],
    q='M'+f(S[0])+' '+f(S[1])+'L'+f(e[0])+' '+f(e[1])+'L'+f(p[0])+' '+f(p[1]);
    set(o,'d',q);set(i,'d',q);set(hd,'cx',f(p[0]));set(hd,'cy',f(p[1]))}
  function pulse(u){return u>0&&u<.45?Math.sin(PI*u/.45):0}

  var K={
   hx:[[0,150],[.3,150],[.9,192],[3.4,192],[4.1,168],[6.2,168],[7.2,150],[9,150]],
   hy:[[0,164],[.3,164],[.9,104],[3.4,104],[4.1,102],[6.2,102],[7.2,164],[9,164]],
   fx:[[0,110],[3.6,110],[4.1,96],[6.2,96],[7.2,110],[9,110]],
   fy:[[0,164],[3.6,164],[4.1,104],[6.2,104],[7.2,164],[9,164]],
   fr:[[0,0],[.5,0],[.9,1],[3.4,1],[3.8,0],[9,0]],
   sh:[[0,0],[3.9,0],[4.2,1],[6.2,1],[6.8,0],[9,0]],
   rf:[[0,0],[.9,0],[1.1,1],[3.2,1],[3.5,0],[9,0]]};

  function render(t){
    var lt=t%T,fr=tr(K.fr,lt),sh=tr(K.sh,lt),rf=tr(K.rf,lt);
    /* braços */
    arm([128,110],[tr(K.fx,lt),tr(K.fy,lt)],'fo','fi','fh');
    arm([132,110],[tr(K.hx,lt)+2*Math.sin(lt*9)*rf,tr(K.hy,lt)+3*Math.sin(lt*14)*rf],'no','ni','nh');
    /* pastas: onda de folheio */
    for(var k=0;k<10;k++){if(!FO[k])continue;var a=-15*pulse(lt-.9-k*.2);FO[k].setAttribute('transform','rotate('+f(a)+' '+f(193.75+k*9.2)+' 132)')}
    /* rosto */
    set('hd','transform','rotate('+f(-5*sh)+' 128 86)');
    var bl=(lt%3.6)<.12?.1:1;set('eyes','transform','translate(0 102) scale(1 '+bl+') translate(0 -102)');
    var dx=2.5*(1-sh),dy=-.5*fr-sh;
    set('p1','cx',f(118.5-2.5+dx));set('p2','cx',f(138.5-2.5+dx));set('p1','cy',f(102+dy));set('p2','cy',f(102+dy));
    var ang=8*fr-12*sh,by=89-3*sh;
    set('b1','transform','translate(116 '+f(by)+') rotate('+f(ang)+')');set('b2','transform','translate(136 '+f(by)+') rotate('+f(-ang)+')');
    set('mo','d','M118 115Q126 '+f(115-6*sh+1*fr)+' 134 115');
    /* interrogações */
    for(k=0;k<3;k++){var q=$('q'+k);q.setAttribute('opacity',f(sh));q.setAttribute('transform','translate(0 '+f(-4*Math.sin(lt*3+k*1.7)-8*(1-sh))+')')}
    /* folha que cai da gaveta */
    var tp=lt-4.4,pp=$('pp');
    if(tp<0||lt>8.9){pp.setAttribute('opacity',0)}
    else{
      var u=Math.max(0,(tp-.6)/2.6),x,y,r,sy=1,op=Math.min(1,tp/.15);
      if(tp<.6){var e=1-Math.pow(1-tp/.6,2);x=234;y=122-62*e;r=0}
      else{x=234-70*sm(u)+9*Math.sin(u*9)*(1-u);y=60+177*sm(u);r=28*Math.sin(u*9)*(1-u)+80*sm(u);sy=1-.65*sm((u-.7)/.3)}
      if(lt>8.3)op=Math.max(0,1-(lt-8.3)/.6);
      pp.setAttribute('opacity',f(op));pp.setAttribute('transform','translate('+f(x)+' '+f(y)+') scale(1 '+f(sy)+') rotate('+f(r)+')');
    }
  }
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)render(5.6);
  else{var last=0,t=0;(function frame(ms){requestAnimationFrame(frame);var d=Math.min((ms-last)/1000||0,.05);last=ms;t+=d;render(t)})(0)}
})();
</script>
</body>
</html>
